name: Bootstrap source versions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-sources.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source history
        run: |
          git clone --depth 1 --branch yarn-notebook-android \
            https://github.com/W1nterdreams/vk-photo-manager.git /tmp/old

      - name: Reconstruct v0.2.13 and v0.2.14
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rebuild
          cd /tmp/rebuild

          cat /tmp/old/ci/yarn-notebook-v0.2.zip.b64.part1 \
              /tmp/old/ci/yarn-notebook-v0.2.zip.b64.part2 > /tmp/yarn-base.b64
          base64 -d /tmp/yarn-base.b64 > /tmp/yarn-base.zip
          unzip -q /tmp/yarn-base.zip -d /tmp/rebuild
          cp /tmp/old/ci/yarn-debug.p12 yarn-notebook-android/app/yarn-debug.p12

          for f in MainActivity.java DbHelper.java YarnRecord.java build.gradle; do
            base64 -d "/tmp/old/ci/v024/$f.gz.b64" | gzip -dc > "/tmp/$f"
          done
          cp /tmp/MainActivity.java yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/MainActivity.java
          cp /tmp/DbHelper.java yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/DbHelper.java
          cp /tmp/YarnRecord.java yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/YarnRecord.java
          cp /tmp/build.gradle yarn-notebook-android/app/build.gradle

          cat /tmp/old/ci/v025/patch.b64.part00 \
              /tmp/old/ci/v025/patch.b64.part01 \
              /tmp/old/ci/v025/patch.b64.part02 \
              /tmp/old/ci/v025/patch.b64.part03 \
              /tmp/old/ci/v025/patch.b64.part04 \
              /tmp/old/ci/v025/patch.b64.part05 \
              /tmp/old/ci/v025/patch.b64.part06 > /tmp/v025.patch.b64
          base64 -d /tmp/v025.patch.b64 > /tmp/v025.patch
          (cd yarn-notebook-android && patch -p1 < /tmp/v025.patch)

          base64 -d /tmp/old/ci/v026/patch.b64 > /tmp/v026.patch
          (cd yarn-notebook-android && patch -p1 < /tmp/v026.patch)

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/rebuild/yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/MainActivity.java')
          src = p.read_text()
          old = 'db.getSuggestions(suggestionField, q, 2)'
          if old not in src:
              raise SystemExit('v0.2.7 target not found')
          p.write_text(src.replace(old, 'db.getSuggestions(suggestionField, q, 1)', 1))
          g = Path('/tmp/rebuild/yarn-notebook-android/app/build.gradle')
          txt = g.read_text().replace('versionCode 7', 'versionCode 8').replace("versionName '0.2.6'", "versionName '0.2.7'")
          g.write_text(txt)
          PY

          base64 -d /tmp/old/ci/v028/patch.b64 > /tmp/v028.patch
          (cd yarn-notebook-android && patch -p1 < /tmp/v028.patch)

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/rebuild/yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/MainActivity.java')
          src = p.read_text()
          old = 'e.setDropDownHeight(dp(100));'
          if old not in src:
              raise SystemExit('v0.2.9 target not found')
          p.write_text(src.replace(old, 'e.setDropDownHeight(ViewGroup.LayoutParams.WRAP_CONTENT);', 1))
          g = Path('/tmp/rebuild/yarn-notebook-android/app/build.gradle')
          txt = g.read_text().replace('versionCode 9', 'versionCode 10').replace("versionName '0.2.8'", "versionName '0.2.9'")
          g.write_text(txt)
          PY

          mkdir -p yarn-notebook-android/app/src/main/res/mipmap-xxxhdpi
          cp /tmp/old/ci/v0210/app_icon.webp yarn-notebook-android/app/src/main/res/mipmap-xxxhdpi/app_icon.webp

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base = Path('/tmp/rebuild/yarn-notebook-android')
          manifest = base / 'app/src/main/AndroidManifest.xml'
          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          app.set(f'{{{ns}}}icon', '@mipmap/app_icon')
          app.set(f'{{{ns}}}roundIcon', '@mipmap/app_icon')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          g = base / 'app/build.gradle'
          txt = g.read_text()
          if 'versionCode 10' not in txt or "versionName '0.2.9'" not in txt:
              raise SystemExit('expected v0.2.9')
          txt = txt.replace('versionCode 10', 'versionCode 11').replace("versionName '0.2.9'", "versionName '0.2.10'")
          g.write_text(txt)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base = Path('/tmp/rebuild/yarn-notebook-android')
          manifest = base / 'app/src/main/AndroidManifest.xml'
          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          app.set(f'{{{ns}}}label', 'Моя пряжа')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          g = base / 'app/build.gradle'
          txt = g.read_text()
          if 'versionCode 11' not in txt or "versionName '0.2.10'" not in txt:
              raise SystemExit('expected v0.2.10')
          txt = txt.replace('versionCode 11', 'versionCode 12').replace("versionName '0.2.10'", "versionName '0.2.11'")
          g.write_text(txt)
          PY

          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/rebuild/yarn-notebook-android')
          p = base / 'app/src/main/java/ru/yarnnotebook/app/MainActivity.java'
          src = p.read_text()
          old = 'StringBuilder b = new StringBuilder();\n        addLine(b, "Страна", r.country);'
          new = 'StringBuilder b = new StringBuilder();\n        b.append("#Калькулятор\\n\\n");\n        addLine(b, "Страна", r.country);'
          if old not in src:
              raise SystemExit('v0.2.13 VK text target not found')
          p.write_text(src.replace(old, new, 1))

          g = base / 'app/build.gradle'
          txt = g.read_text()
          if 'versionCode 12' not in txt or "versionName '0.2.11'" not in txt:
              raise SystemExit('expected v0.2.11')
          txt = txt.replace('versionCode 12', 'versionCode 14').replace("versionName '0.2.11'", "versionName '0.2.13'")
          g.write_text(txt)
          PY

          rm -rf /tmp/src213 /tmp/src214
          cp -a yarn-notebook-android /tmp/src213

          cp /tmp/old/ci/v0214/OverlayService.java yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/OverlayService.java
          python3 /tmp/old/ci/v0214/apply.py
          cp -a yarn-notebook-android /tmp/src214

      - name: Publish source branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_branch() {
            branch="$1"
            src="$2"

            git switch main
            git branch -D "$branch" 2>/dev/null || true
            git switch --orphan "$branch"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$src"/. .
            git add -A
            git commit -m "Source $branch"
            git push --force origin "$branch"
          }

          publish_branch "v0.2.13" "/tmp/src213"
          publish_branch "v0.2.14" "/tmp/src214"

      - name: Put v0.2.14 on main
        shell: bash
        run: |
          set -euo pipefail
          git switch main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/src214/. .
          git add -A
          git commit -m "Use v0.2.14 source on main [skip ci]"
          git push origin main
