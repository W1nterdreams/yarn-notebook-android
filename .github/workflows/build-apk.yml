name: Build APK

on:
  push:
    branches:
      - main
      - moya-pryazha-test-standalone
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        env:
          VKID_CLIENT_SECRET: ${{ secrets.VKID_CLIENT_SECRET }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Generate Gradle Wrapper for local project
        run: gradle --no-daemon wrapper --gradle-version 9.6.0

      - name: Package clean local project
        shell: bash
        run: |
          rm -rf local-package MoyaPryazhaTest-local-project.zip
          mkdir -p local-package/MoyaPryazhaTest
          cp -R app local-package/MoyaPryazhaTest/
          cp -R gradle local-package/MoyaPryazhaTest/
          cp build.gradle settings.gradle gradle.properties gradlew gradlew.bat local-package/MoyaPryazhaTest/
          cp vkid.local.properties README_LOCAL.md BUILD_TEST_APK.bat local-package/MoyaPryazhaTest/
          find local-package/MoyaPryazhaTest -type d \( -name build -o -name .gradle -o -name .idea -o -name .git -o -name .github \) -prune -exec rm -rf {} +
          cd local-package
          zip -r ../MoyaPryazhaTest-local-project.zip MoyaPryazhaTest

      - name: Upload local project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MoyaPryazhaTest-local-project
          path: MoyaPryazhaTest-local-project.zip
          if-no-files-found: error

      - name: Verify APK certificate
        shell: bash
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moya-pryazha-test-v0.1.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
