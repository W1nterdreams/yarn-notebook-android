plugins {
    id 'com.android.application'
}

def vkidProps = new Properties()
def vkidPropsFile = rootProject.file('vkid.local.properties')
if (vkidPropsFile.exists()) {
    vkidPropsFile.withInputStream { vkidProps.load(it) }
}

def vkidClientSecret = vkidProps.getProperty('VKIDClientSecret')
if (!vkidClientSecret) vkidClientSecret = System.getenv('VKID_CLIENT_SECRET')
if (!vkidClientSecret) vkidClientSecret = project.findProperty('VKIDClientSecret')
if (!vkidClientSecret || vkidClientSecret == 'PASTE_VK_PROTECTED_KEY_HERE') {
    vkidClientSecret = 'NOT_CONFIGURED'
}

android {
    namespace 'ru.yarnnotebook.test'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.yarnnotebook.test'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '0.1.4-test'

        manifestPlaceholders = [
                VKIDClientID      : '54803965',
                VKIDClientSecret  : vkidClientSecret,
                VKIDRedirectHost  : 'vk.ru',
                VKIDRedirectScheme: 'vk54803965'
        ]

        buildConfigField 'boolean', 'VKID_SECRET_CONFIGURED',
                vkidClientSecret == 'NOT_CONFIGURED' ? 'false' : 'true'
    }

    signingConfigs {
        debug {
            storeFile file('yarn-debug.p12')
            storePassword 'yarnnotebook'
            keyAlias 'yarnnotebook'
            keyPassword 'yarnnotebook'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'com.vk.id:vkid:2.7.3'
}
